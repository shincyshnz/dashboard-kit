<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Dashboard Kit</title>
    <script>
      // Apply the saved mode and theme before first paint to avoid a flash.
      // Keys must match src/app/providers/theme-provider.tsx.
      try {
        const root = document.documentElement;
        const mode = localStorage.getItem("dk-theme") ?? "system";
        const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.toggle("dark", dark);
        const brand = localStorage.getItem("dk-brand");
        if (brand && brand !== "default") root.setAttribute("data-theme", brand);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
